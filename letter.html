<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mid-State Plumbing - New Construction Welcome Letters</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #c41e3a 0%, #a01729 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.95;
        }

        .content {
            padding: 40px;
        }

        .upload-section {
            background: #f8f9fa;
            border: 3px dashed #c41e3a;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }

        .upload-section:hover {
            border-color: #a01729;
            background: #fff;
        }

        .upload-section h2 {
            color: #1e3c72;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            text-align: left;
        }

        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus, input[type="file"]:focus {
            outline: none;
            border-color: #c41e3a;
        }

        .btn {
            background: linear-gradient(135deg, #c41e3a 0%, #a01729 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin: 10px;
            font-weight: 600;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(196, 30, 58, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .preview-section {
            display: none;
            margin-top: 30px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 2.5em;
            margin-bottom: 5px;
        }

        .stat-card p {
            opacity: 0.9;
        }

        .letter-preview {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 40px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-height: 600px;
            overflow-y: auto;
        }

        .letter-content {
            font-family: Georgia, serif;
            line-height: 1.8;
            color: #333;
        }

        .letter-header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px solid #c41e3a;
            padding-bottom: 20px;
        }

        .letter-header img {
            max-width: 400px;
            height: auto;
            margin-bottom: 15px;
        }

        .letter-header h2 {
            color: #c41e3a;
            font-size: 2em;
            margin-bottom: 5px;
        }

        .letter-header p {
            color: #666;
            font-size: 0.95em;
        }

        .letter-body {
            margin-bottom: 30px;
        }

        .letter-body p {
            margin-bottom: 15px;
        }

        .signature {
            margin-top: 40px;
            font-style: italic;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #c41e3a;
            font-weight: 600;
        }

        .loading.active {
            display: block;
        }

        .error {
            background: #fee;
            border: 2px solid #c41e3a;
            color: #c41e3a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .error.active {
            display: block;
        }

        @media print {
            body {
                background: white;
            }
            .container {
                box-shadow: none;
            }
            .header, .upload-section, .navigation, .btn {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏠 Mid-State Plumbing & Heating</h1>
            <p>New Construction Welcome Letter Generator</p>
        </div>

        <div class="content">
            <div class="error" id="errorMsg"></div>
            <div class="loading" id="loading">Processing your data...</div>

            <div class="upload-section" id="uploadSection">
                <h2>📊 Load Customer Data</h2>
                
                <div class="input-group">
                    <label for="sheetsUrl">Google Sheets URL (must be publicly accessible):</label>
                    <input type="text" id="sheetsUrl" placeholder="https://docs.google.com/spreadsheets/d/...">
                    <button class="btn" onclick="loadFromSheets()">Load from Google Sheets</button>
                </div>

                <div style="margin: 30px 0; color: #999; font-weight: 600;">- OR -</div>

                <div class="input-group">
                    <label for="fileUpload">Upload CSV or Excel File:</label>
                    <input type="file" id="fileUpload" accept=".csv,.xlsx,.xls">
                    <button class="btn" onclick="loadFromFile()">Load from File</button>
                </div>
            </div>

            <div class="preview-section" id="previewSection">
                <div class="stats">
                    <div class="stat-card">
                        <h3 id="totalLetters">0</h3>
                        <p>Total Letters</p>
                    </div>
                    <div class="stat-card">
                        <h3 id="currentIndex">0</h3>
                        <p>Current Letter</p>
                    </div>
                </div>

                <div class="navigation">
                    <button class="btn" onclick="previousLetter()" id="prevBtn">← Previous</button>
                    <span id="navInfo">Letter 1 of 1</span>
                    <button class="btn" onclick="nextLetter()" id="nextBtn">Next →</button>
                </div>

                <div class="letter-preview" id="letterPreview">
                    <!-- Letter content will be generated here -->
                </div>

                <div style="text-align: center;">
                    <button class="btn btn-secondary" onclick="downloadAllLetters()">📥 Download All Letters (PDF)</button>
                    <button class="btn" onclick="downloadCurrentLetter()">📄 Download Current Letter</button>
                    <button class="btn" onclick="resetApp()">🔄 Load New Data</button>
                </div>
            </div>
        </div>
    </div>

        const letterTemplates = {

        function getRandomItem(array) {
            return array[Math.floor(Math.random() * array.length)];
        }

        function formatWorkType(workType) {
            if (!workType) return "plumbing and heating";
            workType = workType.toLowerCase();
            if (workType.includes('hvac') || workType.includes('heating') || workType.includes('ventilation')) {
                return "heating and ventilation";
            }
            if (workType.includes('plumb')) {
                return "plumbing";
            }
            return workType;
        }

        function generateLetter(customer) {
            const yearBuilt = customer.yearBuilt || new Date().getFullYear();
            const builder = customer.builder || "your builder";
            const firstName = customer.firstName || "Valued Homeowner";
            const lastName = customer.lastName || "";
            const address = customer.address || "your new home";
            const workType = formatWorkType(customer.workType);
            
            const fullName = lastName ? `${firstName} ${lastName}` : firstName;
            const greeting = lastName ? `Dear ${firstName} ${lastName}` : `Dear ${fullName}`;

            const opening = getRandomItem(letterTemplates.openings);
            const intro = getRandomItem(letterTemplates.introductions)
                .replace('{builder}', builder)
                .replace('{workType}', workType)
                .replace('{address}', address);
            const services = getRandomItem(letterTemplates.services);
            const community = getRandomItem(letterTemplates.community);
            const closing = getRandomItem(letterTemplates.closings);

                <div class="letter-body">
                    <p><strong>${greeting},</strong></p>
                    
                    <p>${opening}</p>

                    <p>${services}</p>
                    
                    <p><strong>Exclusive Maintenance Program for New Homeowners</strong></p>
                    
                    <p>We're excited to offer you our comprehensive Maintenance Program, designed specifically for homeowners like you. This program:</p>

        function displayLetter(index) {
            if (index < 0 || index >= customerData.length) return;
            
            currentIndex = index;
            const customer = customerData[index];
            const letterHTML = generateLetter(customer);
            
            document.getElementById('letterPreview').innerHTML = `<div class="letter-content">${letterHTML}</div>`;
            document.getElementById('currentIndex').textContent = index + 1;
            document.getElementById('navInfo').textContent = `Letter ${index + 1} of ${customerData.length}`;
            
            document.getElementById('prevBtn').disabled = index === 0;
            document.getElementById('nextBtn').disabled = index === customerData.length - 1;
        }

        function nextLetter() {
            if (currentIndex < customerData.length - 1) {
                displayLetter(currentIndex + 1);
            }
        }

        function previousLetter() {
            if (currentIndex > 0) {
                displayLetter(currentIndex - 1);
            }
        }

        function parseCustomerData(rows) {
            const customers = [];
            
            for (let i = 1; i < rows.length; i++) {
                const row = rows[i];
                
                // Skip completely empty rows
                if (!row || row.length === 0) continue;
                
                // Check if row is mostly empty (all cells are empty/null/undefined)
                const filledCells = row.filter(cell => cell && cell.toString().trim() !== '').length;
                if (filledCells < 3) {
                    console.log(`Skipping row ${i + 1}: mostly empty (only ${filledCells} filled cells)`);
                    continue;
                }
                
                // Check for garbled/binary data
                const testString = (row[0] || '') + (row[1] || '') + (row[2] || '');
                if (/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F-\x9F]/.test(testString)) {
                    console.log(`Skipping row ${i + 1}: contains invalid characters`);
                    continue;
                }
                
                // Validate that we have at least a name or address
                const hasName = (row[1] && row[1].toString().trim()) || (row[2] && row[2].toString().trim());
                const hasAddress = row[3] && row[3].toString().trim();
                
                if (!hasName && !hasAddress) {
                    console.log(`Skipping row ${i + 1}: no valid name or address`);
                    continue;
                }
                
                customers.push({
                    builder: row[0] ? row[0].toString().trim() : '',
                    firstName: row[1] ? row[1].toString().trim() : 'Current',
                    lastName: row[2] ? row[2].toString().trim() : 'Resident',
                    address: row[3] ? row[3].toString().trim() : '',
                    yearBuilt: row[7] ? row[7].toString().trim() : new Date().getFullYear().toString(),
                    workType: row[11] ? row[11].toString().trim() : '',
                    mailingAddress: row[12] ? row[12].toString().trim() : (row[3] ? row[3].toString().trim() : '')
                });
            }
            
            console.log(`Parsed ${customers.length} valid customer records from ${rows.length - 1} total rows`);
            return customers;
        }

        function loadFromSheets() {
            const url = document.getElementById('sheetsUrl').value.trim();
            if (!url) {
                showError('Please enter a Google Sheets URL');
                return;
            }

            let csvUrl = url;
            if (url.includes('/edit')) {
                csvUrl = url.replace('/edit#gid=', '/export?format=csv&gid=')
                            .replace('/edit?usp=sharing', '/export?format=csv')
                            .replace('/edit', '/export?format=csv');
            }

            showLoading(true);
            hideError();

            Papa.parse(csvUrl, {
                download: true,
                complete: function(results) {
                    showLoading(false);
                    if (results.data && results.data.length > 1) {
                        customerData = parseCustomerData(results.data);
                        if (customerData.length === 0) {
                            showError('No valid customer records found in the spreadsheet. Please check the data format.');
                        } else {
                            showPreview();
                        }
                    } else {
                        showError('No data found in the spreadsheet');
                    }
                },
                error: function(error) {
                    showLoading(false);
                    showError('Error loading Google Sheet. Make sure the sheet is publicly accessible (Anyone with the link can view).');
                    console.error('Sheets parsing error:', error);
                }
            });
        }

        function loadFromFile() {
            const fileInput = document.getElementById('fileUpload');
            const file = fileInput.files[0];
            
            if (!file) {
                showError('Please select a file');
                return;
            }

            showLoading(true);
            hideError();

            const reader = new FileReader();
            const fileName = file.name.toLowerCase();

            // Check if it's an Excel file
            if (fileName.endsWith('.xlsx') || fileName.endsWith('.xls')) {
                reader.onload = function(e) {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        
                        // Get the first sheet
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        
                        // Convert to array of arrays
                        const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });
                        
                        showLoading(false);
                        
                        if (jsonData && jsonData.length > 1) {
                            customerData = parseCustomerData(jsonData);
                            if (customerData.length === 0) {
                                showError('No valid customer records found in the file. Please check the data format.');
                            } else {
                                showPreview();
                            }
                        } else {
                            showError('No data found in the file');
                        }
                    } catch (error) {
                        showLoading(false);
                        showError('Error reading Excel file: ' + error.message);
                        console.error('Excel parsing error:', error);
                    }
                };
                reader.readAsArrayBuffer(file);
            } else {
                // Handle CSV files
                Papa.parse(file, {
                    complete: function(results) {
                        showLoading(false);
                        if (results.data && results.data.length > 1) {
                            customerData = parseCustomerData(results.data);
                            if (customerData.length === 0) {
                                showError('No valid customer records found in the file. Please check the data format.');
                            } else {
                                showPreview();
                            }
                        } else {
                            showError('No data found in the file');
                        }
                    },
                    error: function(error) {
                        showLoading(false);
                        showError('Error reading CSV file: ' + error.message);
                        console.error('CSV parsing error:', error);
                    }
                });
            }
        }

        function showPreview() {
            document.getElementById('uploadSection').style.display = 'none';
            document.getElementById('previewSection').style.display = 'block';
            document.getElementById('totalLetters').textContent = customerData.length;
            displayLetter(0);
        }

        function resetApp() {
            document.getElementById('uploadSection').style.display = 'block';
            document.getElementById('previewSection').style.display = 'none';
            document.getElementById('sheetsUrl').value = '';
            document.getElementById('fileUpload').value = '';
            customerData = [];
            currentIndex = 0;
            hideError();
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.textContent = message;
            errorDiv.classList.add('active');
        }

        function hideError() {
            document.getElementById('errorMsg').classList.remove('active');
        }

        function showLoading(show) {
            const loadingDiv = document.getElementById('loading');
            if (show) {
                loadingDiv.classList.add('active');
            } else {
                loadingDiv.classList.remove('active');
            }
        }

        function downloadCurrentLetter() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const customer = customerData[currentIndex];
            
            const letterText = document.getElementById('letterPreview').innerText;
            const splitText = doc.splitTextToSize(letterText, 180);
            
            doc.text(splitText, 15, 15);
            doc.save(`Letter_${customer.firstName}_${customer.lastName}.pdf`);
        }

        function downloadAllLetters() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            showLoading(true);
            
            setTimeout(() => {
                customerData.forEach((customer, index) => {
                    if (index > 0) {
                        doc.addPage();
                    }
                    
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = generateLetter(customer);
                    const letterText = tempDiv.innerText;
                    const splitText = doc.splitTextToSize(letterText, 180);
                    
                    doc.text(splitText, 15, 15);
                });
                
                doc.save('MidState_Welcome_Letters_All.pdf');
                showLoading(false);
            }, 100);
        }
    </script>
</body>
</html>
