<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mid-State Plumbing - New Construction Welcome Letters</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #c41e3a 0%, #a01729 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.95;
        }

        .content {
            padding: 40px;
        }

        .upload-section {
            background: #f8f9fa;
            border: 3px dashed #c41e3a;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }

        .upload-section:hover {
            border-color: #a01729;
            background: #fff;
        }

        .upload-section h2 {
            color: #1e3c72;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            text-align: left;
        }

        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus, input[type="file"]:focus {
            outline: none;
            border-color: #c41e3a;
        }

        .btn {
            background: linear-gradient(135deg, #c41e3a 0%, #a01729 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin: 10px;
            font-weight: 600;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(196, 30, 58, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .preview-section {
            display: none;
            margin-top: 30px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 2.5em;
            margin-bottom: 5px;
        }

        .stat-card p {
            opacity: 0.9;
        }

        .letter-preview {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 40px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-height: 600px;
            overflow-y: auto;
        }

        .letter-content {
            font-family: Georgia, serif;
            line-height: 1.8;
            color: #333;
        }

        .letter-header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px solid #c41e3a;
            padding-bottom: 20px;
        }

        .letter-header h2 {
            color: #c41e3a;
            font-size: 2em;
            margin-bottom: 5px;
        }

        .letter-header p {
            color: #666;
            font-size: 0.95em;
        }

        .letter-body {
            margin-bottom: 30px;
        }

        .letter-body p {
            margin-bottom: 15px;
        }

        .signature {
            margin-top: 40px;
            font-style: italic;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #c41e3a;
            font-weight: 600;
        }

        .loading.active {
            display: block;
        }

        .error {
            background: #fee;
            border: 2px solid #c41e3a;
            color: #c41e3a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .error.active {
            display: block;
        }

        @media print {
            body {
                background: white;
            }
            .container {
                box-shadow: none;
            }
            .header, .upload-section, .navigation, .btn {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏠 Mid-State Plumbing & Heating</h1>
            <p>New Construction Welcome Letter Generator</p>
        </div>

        <div class="content">
            <div class="error" id="errorMsg"></div>
            <div class="loading" id="loading">Processing your data...</div>

            <div class="upload-section" id="uploadSection">
                <h2>📊 Load Customer Data</h2>
                
                <div class="input-group">
                    <label for="sheetsUrl">Google Sheets URL (must be publicly accessible):</label>
                    <input type="text" id="sheetsUrl" placeholder="https://docs.google.com/spreadsheets/d/...">
                    <button class="btn" onclick="loadFromSheets()">Load from Google Sheets</button>
                </div>

                <div style="margin: 30px 0; color: #999; font-weight: 600;">- OR -</div>

                <div class="input-group">
                    <label for="fileUpload">Upload CSV or Excel File:</label>
                    <input type="file" id="fileUpload" accept=".csv,.xlsx,.xls">
                    <button class="btn" onclick="loadFromFile()">Load from File</button>
                </div>
            </div>

            <div class="preview-section" id="previewSection">
                <div class="stats">
                    <div class="stat-card">
                        <h3 id="totalLetters">0</h3>
                        <p>Total Letters</p>
                    </div>
                    <div class="stat-card">
                        <h3 id="currentIndex">0</h3>
                        <p>Current Letter</p>
                    </div>
                </div>

                <div class="navigation">
                    <button class="btn" onclick="previousLetter()" id="prevBtn">← Previous</button>
                    <span id="navInfo">Letter 1 of 1</span>
                    <button class="btn" onclick="nextLetter()" id="nextBtn">Next →</button>
                </div>

                <div class="letter-preview" id="letterPreview">
                    <!-- Letter content will be generated here -->
                </div>

                <div style="text-align: center;">
                    <button class="btn btn-secondary" onclick="downloadAllLetters()">📥 Download All Letters (PDF)</button>
                    <button class="btn" onclick="downloadCurrentLetter()">📄 Download Current Letter</button>
                    <button class="btn" onclick="resetApp()">🔄 Load New Data</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let customerData = [];
        let currentIndex = 0;

        const letterTemplates = {
            openings: [
                "We hope you're settling into your beautiful new home!",
                "Congratulations on your new home!",
                "Welcome to your new home!",
                "We're delighted to welcome you to your new residence!",
                "It's wonderful to know you've moved into your new home!"
            ],
            introductions: [
                "Mid-State Plumbing & Heating had the privilege of working with {builder} on the {workType} for your home at {address}. We wanted to reach out personally to introduce ourselves and let you know we're here for you.",
                "We had the pleasure of partnering with {builder} to complete the {workType} work in your new home at {address}. Now that you're settled in, we wanted to connect with you directly.",
                "Our team worked alongside {builder} to handle the {workType} installation at {address}, and we're proud to have been part of bringing your new home to life.",
                "Working with {builder}, we completed the {workType} systems for your home at {address}. As you begin this exciting new chapter, we want you to know we're your local partner for all things plumbing and heating."
            ],
            services: [
                "Whether you need help with heating, air conditioning, plumbing, or drain services, our experienced team is just a phone call away.",
                "From routine maintenance to emergency repairs, we're equipped to handle all your heating, cooling, plumbing, and drain needs.",
                "Our comprehensive services cover everything from furnace tune-ups to plumbing repairs, water heaters to drain cleaning.",
                "No matter the season or the issue—heating, cooling, plumbing, or drains—we're here to keep your home comfortable and running smoothly."
            ],
            community: [
                "As a locally-owned business based in Hastings, MN, we're deeply committed to our community. We're proud to be the presenting sponsor for the 2025 Birdies for Abilities Golf Tournament on June 23, 2025, supporting education, therapy, and employment for individuals with special needs. We also recently supported Hockey Day MN in January 2025, celebrating local players and our Hastings community.",
                "Community matters to us. Based right here in Hastings, MN, we actively support local causes like the Birdies for Abilities Golf Tournament (June 23, 2025), which helps provide vital services for individuals with special needs. We were also honored to support our local hockey players during Hockey Day MN this past January.",
                "Being part of this community means giving back. We're the presenting sponsor for the upcoming Birdies for Abilities Golf Tournament in June 2025, supporting the Ability 2 Believe mission. We also proudly supported Hockey Day MN celebrations right here in Hastings this January."
            ],
            closings: [
                "Thank you for allowing us to be part of your home-building journey. We look forward to serving you for years to come.",
                "We're honored to have contributed to your new home and excited to be your trusted partner for all your home comfort needs.",
                "It's been our pleasure to work on your home, and we're committed to being here whenever you need us.",
                "We appreciate the opportunity to have served your new home and look forward to a long relationship with you."
            ]
        };

        function getRandomItem(array) {
            return array[Math.floor(Math.random() * array.length)];
        }

        function formatWorkType(workType) {
            if (!workType) return "plumbing and heating";
            workType = workType.toLowerCase();
            if (workType.includes('hvac') || workType.includes('heating') || workType.includes('ventilation')) {
                return "heating and ventilation";
            }
            if (workType.includes('plumb')) {
                return "plumbing";
            }
            return workType;
        }

        function generateLetter(customer) {
            const yearBuilt = customer.yearBuilt || new Date().getFullYear();
            const builder = customer.builder || "your builder";
            const firstName = customer.firstName || "Valued Homeowner";
            const lastName = customer.lastName || "";
            const address = customer.address || "your new home";
            const workType = formatWorkType(customer.workType);
            
            const fullName = lastName ? `${firstName} ${lastName}` : firstName;
            const greeting = lastName ? `Dear ${firstName} ${lastName}` : `Dear ${fullName}`;

            const opening = getRandomItem(letterTemplates.openings);
            const intro = getRandomItem(letterTemplates.introductions)
                .replace('{builder}', builder)
                .replace('{workType}', workType)
                .replace('{address}', address);
            const services = getRandomItem(letterTemplates.services);
            const community = getRandomItem(letterTemplates.community);
            const closing = getRandomItem(letterTemplates.closings);

            return `
                <div class="letter-header">
                    <h2>MID-STATE PLUMBING & HEATING</h2>
                    <p>Serving the Twin Cities Metropolitan Area | Based in Hastings, MN</p>
                    <p>Phone: (651) 438-3252 | www.midstateplumbing.com</p>
                </div>
                <div class="letter-body">
                    <p><strong>${greeting},</strong></p>
                    
                    <p>${opening}</p>
                    
                    <p>${intro}</p>
                    
                    <p>${services}</p>
                    
                    <p><strong>Exclusive Maintenance Program for New Homeowners</strong></p>
                    
                    <p>We're excited to offer you our comprehensive Maintenance Program, designed specifically for homeowners like you. This program:</p>
                    
                    <ul style="margin-left: 30px; margin-bottom: 15px;">
                        <li><strong>Satisfies manufacturer warranty requirements</strong>, ensuring your equipment stays covered</li>
                        <li><strong>Extends the life of your heating and cooling systems</strong> through regular professional maintenance</li>
                        <li><strong>Saves you money</strong> with a 10% discount on all repairs and projects as long as you're a member</li>
                        <li><strong>Provides priority scheduling</strong> when you need service</li>
                        <li><strong>Catches small issues before they become expensive problems</strong></li>
                    </ul>
                    
                    <p>Your home built in ${yearBuilt} represents a significant investment, and our maintenance program is designed to protect that investment while giving you peace of mind year-round.</p>
                    
                    <p>${community}</p>
                    
                    <p>${closing}</p>
                    
                    <div class="signature">
                        <p><strong>Warmly,</strong></p>
                        <p><strong>The Mid-State Plumbing & Heating Team</strong></p>
                        <p>Hastings, MN</p>
                        <p>(651) 438-3252</p>
                    </div>
                    
                    <p style="margin-top: 30px; padding-top: 20px; border-top: 2px solid #eee; font-size: 0.9em; color: #666;">
                        <em>P.S. We're here 24/7 for emergencies. Don't hesitate to call if you need us!</em>
                    </p>
                </div>
            `;
        }

        function displayLetter(index) {
            if (index < 0 || index >= customerData.length) return;
            
            currentIndex = index;
            const customer = customerData[index];
            const letterHTML = generateLetter(customer);
            
            document.getElementById('letterPreview').innerHTML = `<div class="letter-content">${letterHTML}</div>`;
            document.getElementById('currentIndex').textContent = index + 1;
            document.getElementById('navInfo').textContent = `Letter ${index + 1} of ${customerData.length}`;
            
            document.getElementById('prevBtn').disabled = index === 0;
            document.getElementById('nextBtn').disabled = index === customerData.length - 1;
        }

        function nextLetter() {
            if (currentIndex < customerData.length - 1) {
                displayLetter(currentIndex + 1);
            }
        }

        function previousLetter() {
            if (currentIndex > 0) {
                displayLetter(currentIndex - 1);
            }
        }

        function parseCustomerData(rows) {
            const customers = [];
            
            for (let i = 1; i < rows.length; i++) {
                const row = rows[i];
                if (!row || row.length < 2) continue;
                
                customers.push({
                    builder: row[0] || '',
                    firstName: row[1] || 'Current',
                    lastName: row[2] || 'Resident',
                    address: row[3] || '',
                    yearBuilt: row[7] || new Date().getFullYear(),
                    workType: row[11] || '',
                    mailingAddress: row[12] || row[3] || ''
                });
            }
            
            return customers;
        }

        function loadFromSheets() {
            const url = document.getElementById('sheetsUrl').value.trim();
            if (!url) {
                showError('Please enter a Google Sheets URL');
                return;
            }

            let csvUrl = url;
            if (url.includes('/edit')) {
                csvUrl = url.replace('/edit#gid=', '/export?format=csv&gid=')
                            .replace('/edit?usp=sharing', '/export?format=csv')
                            .replace('/edit', '/export?format=csv');
            }

            showLoading(true);
            hideError();

            Papa.parse(csvUrl, {
                download: true,
                complete: function(results) {
                    showLoading(false);
                    if (results.data && results.data.length > 1) {
                        customerData = parseCustomerData(results.data);
                        showPreview();
                    } else {
                        showError('No data found in the spreadsheet');
                    }
                },
                error: function(error) {
                    showLoading(false);
                    showError('Error loading Google Sheet. Make sure the sheet is publicly accessible (Anyone with the link can view).');
                }
            });
        }

        function loadFromFile() {
            const fileInput = document.getElementById('fileUpload');
            const file = fileInput.files[0];
            
            if (!file) {
                showError('Please select a file');
                return;
            }

            showLoading(true);
            hideError();

            Papa.parse(file, {
                complete: function(results) {
                    showLoading(false);
                    if (results.data && results.data.length > 1) {
                        customerData = parseCustomerData(results.data);
                        showPreview();
                    } else {
                        showError('No data found in the file');
                    }
                },
                error: function(error) {
                    showLoading(false);
                    showError('Error reading file: ' + error.message);
                }
            });
        }

        function showPreview() {
            document.getElementById('uploadSection').style.display = 'none';
            document.getElementById('previewSection').style.display = 'block';
            document.getElementById('totalLetters').textContent = customerData.length;
            displayLetter(0);
        }

        function resetApp() {
            document.getElementById('uploadSection').style.display = 'block';
            document.getElementById('previewSection').style.display = 'none';
            document.getElementById('sheetsUrl').value = '';
            document.getElementById('fileUpload').value = '';
            customerData = [];
            currentIndex = 0;
            hideError();
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.textContent = message;
            errorDiv.classList.add('active');
        }

        function hideError() {
            document.getElementById('errorMsg').classList.remove('active');
        }

        function showLoading(show) {
            const loadingDiv = document.getElementById('loading');
            if (show) {
                loadingDiv.classList.add('active');
            } else {
                loadingDiv.classList.remove('active');
            }
        }

        function downloadCurrentLetter() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const customer = customerData[currentIndex];
            
            const letterText = document.getElementById('letterPreview').innerText;
            const splitText = doc.splitTextToSize(letterText, 180);
            
            doc.text(splitText, 15, 15);
            doc.save(`Letter_${customer.firstName}_${customer.lastName}.pdf`);
        }

        function downloadAllLetters() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            showLoading(true);
            
            setTimeout(() => {
                customerData.forEach((customer, index) => {
                    if (index > 0) {
                        doc.addPage();
                    }
                    
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = generateLetter(customer);
                    const letterText = tempDiv.innerText;
                    const splitText = doc.splitTextToSize(letterText, 180);
                    
                    doc.text(splitText, 15, 15);
                });
                
                doc.save('MidState_Welcome_Letters_All.pdf');
                showLoading(false);
            }, 100);
        }
    </script>
</body>
</html>
