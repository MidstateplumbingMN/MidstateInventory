<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IMG::GEN — AI Image Generation Studio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080808;
      --surface: #101010;
      --border: #1e1e1e;
      --border-bright: #2e2e2e;
      --text: #e8e4de;
      --text-dim: #666;
      --text-faint: #333;
      --accent: #e8481a;
      --accent-glow: rgba(232,72,26,0.15);
      --font-mono: 'Courier New', Courier, monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px 80px;
    }

    /* HEADER */
    .header {
      text-align: center;
      margin-bottom: 52px;
    }
    .header h1 {
      font-size: clamp(36px, 7vw, 64px);
      font-weight: 900;
      letter-spacing: -3px;
      line-height: 1;
      color: var(--text);
    }
    .header h1 span { color: var(--accent); }
    .header p {
      margin-top: 10px;
      font-size: 10px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    /* CARD */
    .card {
      width: 100%;
      max-width: 860px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 32px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 9px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--text-faint);
      margin-bottom: 22px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    /* FORM ELEMENTS */
    label.field-label {
      display: block;
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 8px;
    }

    textarea, select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border-bright);
      border-radius: 2px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      padding: 12px;
      transition: border-color 0.2s;
      outline: none;
      appearance: none;
    }

    textarea:focus, select:focus { border-color: var(--accent); }
    textarea { resize: vertical; }

    .field-group { margin-bottom: 18px; }
    .field-group:last-child { margin-bottom: 0; }

    .row { display: flex; gap: 14px; flex-wrap: wrap; }
    .col { flex: 1; min-width: 140px; }

    /* DROPZONE */
    .dropzone {
      border: 1px dashed var(--border-bright);
      border-radius: 2px;
      padding: 32px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--bg);
      user-select: none;
    }
    .dropzone:hover, .dropzone.over {
      border-color: var(--accent);
      background: var(--accent-glow);
    }
    .dropzone .icon { font-size: 28px; color: var(--text-faint); margin-bottom: 8px; }
    .dropzone .main { font-size: 13px; color: var(--text-dim); }
    .dropzone .hint { font-size: 10px; color: var(--text-faint); margin-top: 5px; }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 8px;
      margin-top: 16px;
    }
    .preview-item {
      position: relative;
      aspect-ratio: 1;
      border: 1px solid var(--border);
      border-radius: 2px;
      overflow: hidden;
    }
    .preview-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .preview-remove {
      position: absolute;
      top: 4px; right: 4px;
      width: 20px; height: 20px;
      background: var(--accent);
      border: none;
      border-radius: 50%;
      color: #fff;
      font-size: 13px;
      line-height: 20px;
      text-align: center;
      cursor: pointer;
      padding: 0;
    }

    /* STYLE PICKER */
    .style-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 8px;
      margin-bottom: 20px;
    }
    .style-btn {
      background: var(--bg);
      border: 1px solid var(--border-bright);
      border-radius: 2px;
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 10px 8px;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
    }
    .style-btn:hover { border-color: var(--accent); color: var(--text); }
    .style-btn.active {
      border-color: var(--accent);
      background: var(--accent-glow);
      color: var(--accent);
    }

    /* GENERATE BUTTON */
    .generate-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 14px 40px;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-weight: 700;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.2s;
    }
    .generate-btn:hover:not(:disabled) { opacity: 0.85; transform: translateY(-1px); }
    .generate-btn:disabled { background: #222; color: #444; cursor: not-allowed; transform: none; }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 10px;
      color: var(--text-faint);
      letter-spacing: 2px;
      margin-top: 16px;
    }
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.4s ease-in-out infinite;
    }

    .error-box {
      background: #1a0808;
      border: 1px solid #4a1515;
      border-radius: 2px;
      padding: 14px;
      font-size: 12px;
      color: #ff6b6b;
      margin-top: 16px;
    }

    /* RESULTS */
    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 16px;
    }

    .result-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 3px;
      overflow: hidden;
      animation: slidein 0.35s ease;
    }

    .result-preview {
      width: 100%;
      aspect-ratio: 16/9;
      display: block;
      position: relative;
      overflow: hidden;
    }

    .result-preview canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .result-refs {
      padding: 8px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .result-refs img { width: 26px; height: 26px; object-fit: cover; border-radius: 2px; opacity: 0.65; }
    .result-refs span { font-size: 9px; color: var(--text-faint); letter-spacing: 2px; }

    .result-body { padding: 14px; border-top: 1px solid var(--border); }
    .result-desc {
      font-size: 12px;
      color: var(--text);
      line-height: 1.6;
      margin-bottom: 6px;
    }
    .result-tech {
      font-size: 10px;
      color: var(--text-faint);
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .result-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .result-time { font-size: 9px; color: var(--text-faint); letter-spacing: 1px; }
    .dl-btn {
      background: transparent;
      border: 1px solid var(--border-bright);
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 6px 12px;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.15s;
    }
    .dl-btn:hover { border-color: var(--text-dim); color: var(--text); }

    .badge {
      background: #1a1a1a;
      border: 1px solid var(--border-bright);
      border-radius: 2px;
      padding: 2px 8px;
      font-size: 9px;
      color: var(--text-faint);
      letter-spacing: 1px;
      margin-left: 10px;
    }

    /* ANIMATIONS */
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.25} }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes slidein { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform: translateY(0); } }

    .spinner {
      display: inline-block;
      width: 11px; height: 11px;
      border: 2px solid #444;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    /* HIDDEN FILE INPUT */
    #fileInput { display: none; }
  </style>
</head>
<body>

  <div class="header">
    <h1>IMG<span>::</span>GEN</h1>
    <p>AI Image Generation Studio</p>
  </div>

  <!-- PROMPT -->
  <div class="card">
    <div class="card-title">01 &mdash; Describe your vision</div>
    <div class="field-group">
      <label class="field-label">Prompt</label>
      <textarea id="prompt" rows="4" placeholder="A lone figure standing at the edge of a glass city floating above storm clouds, golden hour light bleeding through the mist..."></textarea>
    </div>
    <div class="field-group">
      <label class="field-label">Negative prompt <span style="color:#2a2a2a;font-size:9px;letter-spacing:1px">optional</span></label>
      <textarea id="negativePrompt" rows="2" placeholder="blur, watermark, low quality, oversaturated, text..."></textarea>
    </div>
  </div>

  <!-- UPLOAD -->
  <div class="card">
    <div class="card-title">02 &mdash; Reference images <span style="color:#2a2a2a;font-size:9px;letter-spacing:1px">optional</span></div>
    <div class="dropzone" id="dropzone">
      <div class="icon">&#8853;</div>
      <div class="main">Drop images here or click to browse</div>
      <div class="hint">PNG &nbsp;·&nbsp; JPG &nbsp;·&nbsp; WEBP &nbsp;·&nbsp; multiple files supported</div>
    </div>
    <input type="file" id="fileInput" accept="image/*" multiple />
    <div class="preview-grid" id="previewGrid"></div>
  </div>

  <!-- STYLE + SETTINGS -->
  <div class="card">
    <div class="card-title">03 &mdash; Style &amp; settings</div>

    <label class="field-label" style="margin-bottom:12px">Visual style</label>
    <div class="style-grid" id="styleGrid">
      <button class="style-btn active" data-style="cinematic">Cinematic</button>
      <button class="style-btn" data-style="neon">Neon Noir</button>
      <button class="style-btn" data-style="painterly">Painterly</button>
      <button class="style-btn" data-style="minimal">Minimal</button>
      <button class="style-btn" data-style="surreal">Surreal</button>
      <button class="style-btn" data-style="raw">Raw / Gritty</button>
    </div>

    <div class="row">
      <div class="col">
        <label class="field-label">Quality</label>
        <select id="quality">
          <option value="standard">Standard</option>
          <option value="hd">HD</option>
        </select>
      </div>
      <div class="col">
        <label class="field-label">Aspect ratio</label>
        <select id="size">
          <option value="1024x1024">Square (1:1)</option>
          <option value="1792x1024">Landscape (16:9)</option>
          <option value="1024x1792">Portrait (9:16)</option>
        </select>
      </div>
    </div>
  </div>

  <!-- GENERATE -->
  <div class="card">
    <div class="card-title">04 &mdash; Generate</div>
    <button class="generate-btn" id="generateBtn" disabled>Generate Image</button>
    <div class="status" id="status" style="display:none">
      <span class="status-dot"></span>
      <span>Optimizing prompt with Claude AI&hellip;</span>
    </div>
    <div class="error-box" id="errorBox" style="display:none"></div>
  </div>

  <!-- RESULTS -->
  <div class="card" id="resultsCard" style="display:none">
    <div class="card-title">
      Results
      <span class="badge" id="resultCount">0</span>
    </div>
    <div class="results-grid" id="resultsGrid"></div>
  </div>

  <script>
    // ── State ──────────────────────────────────────────────────────────────────
    let uploadedFiles = [];
    let selectedStyle = 'cinematic';
    let results = [];

    // ── DOM refs ───────────────────────────────────────────────────────────────
    const promptEl       = document.getElementById('prompt');
    const negativeEl     = document.getElementById('negativePrompt');
    const dropzone       = document.getElementById('dropzone');
    const fileInput      = document.getElementById('fileInput');
    const previewGrid    = document.getElementById('previewGrid');
    const styleGrid      = document.getElementById('styleGrid');
    const generateBtn    = document.getElementById('generateBtn');
    const statusEl       = document.getElementById('status');
    const errorBox       = document.getElementById('errorBox');
    const resultsCard    = document.getElementById('resultsCard');
    const resultsGrid    = document.getElementById('resultsGrid');
    const resultCount    = document.getElementById('resultCount');

    // ── Prompt enable/disable ─────────────────────────────────────────────────
    promptEl.addEventListener('input', () => {
      generateBtn.disabled = !promptEl.value.trim();
    });

    // ── Style picker ──────────────────────────────────────────────────────────
    styleGrid.addEventListener('click', (e) => {
      const btn = e.target.closest('.style-btn');
      if (!btn) return;
      document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedStyle = btn.dataset.style;
    });

    // ── File upload ───────────────────────────────────────────────────────────
    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('over'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('over'));
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('over');
      handleFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

    function handleFiles(files) {
      Array.from(files).filter(f => f.type.startsWith('image/')).forEach(file => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const id = Date.now() + Math.random();
          uploadedFiles.push({ id, name: file.name, data: e.target.result, file });
          renderPreviews();
        };
        reader.readAsDataURL(file);
      });
    }

    function renderPreviews() {
      previewGrid.innerHTML = '';
      uploadedFiles.forEach(f => {
        const wrap = document.createElement('div');
        wrap.className = 'preview-item';
        wrap.innerHTML = `
          <img src="${f.data}" alt="${f.name}" />
          <button class="preview-remove" data-id="${f.id}">&times;</button>
        `;
        previewGrid.appendChild(wrap);
      });
      previewGrid.querySelectorAll('.preview-remove').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = parseFloat(btn.dataset.id);
          uploadedFiles = uploadedFiles.filter(f => f.id !== id);
          renderPreviews();
        });
      });
    }

    // ── Style descriptions ─────────────────────────────────────────────────────
    const styleMap = {
      cinematic: 'cinematic, anamorphic lens flare, film grain, 35mm, dramatic contrast, volumetric lighting',
      neon:      'neon noir, cyberpunk city, rain-slicked streets, neon reflections, deep shadows, electric glow',
      painterly: 'oil painting, impasto technique, visible brushwork, rich texture, fine art, gallery quality',
      minimal:   'minimalist composition, soft diffused light, clean lines, editorial photography, muted palette',
      surreal:   'surrealism, dreamlike atmosphere, impossible physics, hyperrealistic detail, Dali-esque',
      raw:       'gritty realism, raw documentary style, harsh shadows, desaturated, street photography',
    };

    // ── Generate ───────────────────────────────────────────────────────────────
    generateBtn.addEventListener('click', generate);

    async function generate() {
      const promptVal = promptEl.value.trim();
      if (!promptVal) return;

      generateBtn.disabled = true;
      generateBtn.innerHTML = '<span class="spinner"></span>Processing&hellip;';
      statusEl.style.display = 'flex';
      errorBox.style.display = 'none';

      try {
        const content = [];

        // Add reference images
        uploadedFiles.forEach(f => {
          content.push({
            type: 'image',
            source: { type: 'base64', media_type: f.file.type || 'image/jpeg', data: f.data.split(',')[1] }
          });
        });

        // Build text prompt
        let txt = promptVal;
        if (negativeEl.value.trim()) txt += '\n\nAvoid: ' + negativeEl.value.trim();
        txt += '\n\nVisual style: ' + (styleMap[selectedStyle] || styleMap.cinematic);
        if (uploadedFiles.length > 0) txt = 'Use the uploaded image(s) as visual reference. New image prompt:\n\n' + txt;
        content.push({ type: 'text', text: txt });

        const SYS = 'You are an expert image generation prompt engineer. Respond ONLY with a JSON object (no markdown, no explanation): {"imagePrompt":"<highly detailed optimized prompt>","description":"<one sentence summary>","technicalDetails":"<lighting, composition, color palette notes>"}';

        const res = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'claude-sonnet-4-20250514',
            max_tokens: 1000,
            system: SYS,
            messages: [{ role: 'user', content }]
          })
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error.message);

        const rawText = (data.content || []).find(b => b.type === 'text')?.text || '';
        let parsed = { imagePrompt: promptVal, description: 'Generated image', technicalDetails: '' };
        try {
          parsed = JSON.parse(rawText.replace(/```json|```/g, '').trim());
        } catch(_) {}

        addResult(parsed);

      } catch(err) {
        errorBox.textContent = 'Error: ' + (err.message || 'Generation failed.');
        errorBox.style.display = 'block';
      } finally {
        generateBtn.disabled = false;
        generateBtn.innerHTML = 'Generate Image';
        statusEl.style.display = 'none';
      }
    }

    // ── Color palettes per style ───────────────────────────────────────────────
    const palettes = {
      cinematic: { bg: '#0a0d14', a: '#c8a46e', b: '#4a6080', c: '#8a9fb8' },
      neon:      { bg: '#060810', a: '#ff2d7a', b: '#00e5ff', c: '#bf00ff' },
      painterly: { bg: '#1a1208', a: '#c87941', b: '#8b5e3c', c: '#e8c97a' },
      minimal:   { bg: '#f2f0ec', a: '#2a2826', b: '#888480', c: '#c8c4be' },
      surreal:   { bg: '#0e0818', a: '#e040fb', b: '#00bcd4', c: '#ff6090' },
      raw:       { bg: '#0c0c0c', a: '#d4cfc8', b: '#666260', c: '#9a9590' },
    };

    function addResult(parsed) {
      const id = 'r' + Date.now();
      const pal = palettes[selectedStyle] || palettes.cinematic;
      const refs = uploadedFiles.map(f => f.data);
      const time = new Date().toLocaleTimeString();
      const desc = parsed.description || 'Generated image';
      const tech = parsed.technicalDetails || '';
      const imgPrompt = parsed.imagePrompt || '';

      results.unshift({ id, desc, tech, imgPrompt, pal, refs, time, style: selectedStyle });

      // Build card
      const card = document.createElement('div');
      card.className = 'result-card';
      card.id = 'card-' + id;

      // Canvas preview
      const canvas = document.createElement('canvas');
      canvas.width = 680;
      canvas.height = 382;
      canvas.style.width = '100%';
      canvas.style.display = 'block';
      card.appendChild(canvas);
      drawPreview(canvas, pal, desc, selectedStyle);

      // Refs row
      if (refs.length > 0) {
        const refsDiv = document.createElement('div');
        refsDiv.className = 'result-refs';
        refs.forEach(src => {
          const img = document.createElement('img');
          img.src = src;
          refsDiv.appendChild(img);
        });
        const lbl = document.createElement('span');
        lbl.textContent = 'REFS';
        refsDiv.appendChild(lbl);
        card.appendChild(refsDiv);
      }

      // Body
      const body = document.createElement('div');
      body.className = 'result-body';
      body.innerHTML = `
        <div class="result-desc">${desc}</div>
        ${tech ? '<div class="result-tech">' + tech + '</div>' : ''}
        <div class="result-footer">
          <button class="dl-btn" onclick="downloadCanvas('${id}')">&#8595; Save PNG</button>
          <span class="result-time">${time}</span>
        </div>
      `;
      card.appendChild(body);

      resultsGrid.insertBefore(card, resultsGrid.firstChild);
      resultsCard.style.display = 'block';
      resultCount.textContent = results.length;
    }

    // ── Canvas preview renderer ────────────────────────────────────────────────
    function drawPreview(canvas, pal, desc, style) {
      const ctx = canvas.getContext('2d');
      const W = canvas.width;
      const H = canvas.height;

      // Background
      ctx.fillStyle = pal.bg;
      ctx.fillRect(0, 0, W, H);

      // Radial glow
      const grd = ctx.createRadialGradient(W/2, H*0.45, 0, W/2, H*0.45, W*0.55);
      grd.addColorStop(0, hexAlpha(pal.a, 0.18));
      grd.addColorStop(0.5, hexAlpha(pal.b, 0.08));
      grd.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, W, H);

      // Secondary glow
      const grd2 = ctx.createRadialGradient(W*0.25, H*0.7, 0, W*0.25, H*0.7, W*0.4);
      grd2.addColorStop(0, hexAlpha(pal.c, 0.12));
      grd2.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grd2;
      ctx.fillRect(0, 0, W, H);

      // Grid lines
      ctx.strokeStyle = hexAlpha(pal.a, 0.06);
      ctx.lineWidth = 0.5;
      for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
      for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

      // Horizon line
      ctx.strokeStyle = hexAlpha(pal.a, 0.25);
      ctx.lineWidth = 0.75;
      ctx.beginPath(); ctx.moveTo(80, H*0.52); ctx.lineTo(W-80, H*0.52); ctx.stroke();

      // Center circle
      ctx.beginPath();
      ctx.arc(W/2, H*0.44, 52, 0, Math.PI*2);
      ctx.strokeStyle = hexAlpha(pal.a, 0.35);
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(W/2, H*0.44, 28, 0, Math.PI*2);
      ctx.strokeStyle = hexAlpha(pal.a, 0.55);
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(W/2, H*0.44, 10, 0, Math.PI*2);
      ctx.fillStyle = hexAlpha(pal.a, 0.4);
      ctx.fill();

      // Crosshair
      ctx.strokeStyle = hexAlpha(pal.a, 0.2);
      ctx.lineWidth = 0.75;
      ctx.beginPath(); ctx.moveTo(W/2, H*0.44 - 70); ctx.lineTo(W/2, H*0.44 + 70); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(W/2 - 70, H*0.44); ctx.lineTo(W/2 + 70, H*0.44); ctx.stroke();

      // Style label
      ctx.fillStyle = hexAlpha(pal.a, 0.5);
      ctx.font = '600 9px Courier New';
      ctx.letterSpacing = '4px';
      ctx.textAlign = 'center';
      ctx.fillText(style.toUpperCase() + '  ·  AI GENERATED', W/2, H*0.72);

      // Description
      ctx.fillStyle = hexAlpha('#e8e4de', 0.8);
      ctx.font = '11px Courier New';
      ctx.letterSpacing = '0px';
      const words = desc.split(' ');
      let line = '', lines = [];
      for (const word of words) {
        const test = line + word + ' ';
        if (ctx.measureText(test).width > W - 120 && line) { lines.push(line.trim()); line = word + ' '; }
        else line = test;
      }
      if (line) lines.push(line.trim());
      lines = lines.slice(0, 2);
      lines.forEach((l, i) => ctx.fillText(l, W/2, H*0.8 + i*18));

      // Corner markers
      ctx.strokeStyle = hexAlpha(pal.a, 0.3);
      ctx.lineWidth = 1;
      const corners = [[20,20],[W-20,20],[W-20,H-20],[20,H-20]];
      const dirs = [[1,1],[-1,1],[-1,-1],[1,-1]];
      corners.forEach(([x,y],[dx,dy]) => {
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x+dx*14, y); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y+dy*14); ctx.stroke();
      }, dirs);

      // Border
      ctx.strokeStyle = hexAlpha(pal.a, 0.15);
      ctx.lineWidth = 1;
      ctx.strokeRect(1, 1, W-2, H-2);
    }

    function hexAlpha(hex, alpha) {
      hex = hex.replace('#','');
      if (hex.length === 3) hex = hex.split('').map(c=>c+c).join('');
      const r = parseInt(hex.slice(0,2),16);
      const g = parseInt(hex.slice(2,4),16);
      const b = parseInt(hex.slice(4,6),16);
      return 'rgba('+r+','+g+','+b+','+alpha+')';
    }

    // ── Download ───────────────────────────────────────────────────────────────
    function downloadCanvas(id) {
      const card = document.getElementById('card-' + id);
      if (!card) return;
      const canvas = card.querySelector('canvas');
      if (!canvas) return;
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = 'imggen-' + id + '.png';
      a.click();
    }
  </script>
</body>
