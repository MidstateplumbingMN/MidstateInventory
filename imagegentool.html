<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>IMG::GEN</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#080808;--sur:#101010;--brd:#1e1e1e;--brd2:#2e2e2e;--txt:#e8e4de;--dim:#666;--faint:#333;--acc:#e8481a;--glow:rgba(232,72,26,0.12);--mono:'Courier New',monospace}
body{background:var(--bg);color:var(--txt);font-family:var(--mono);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:48px 20px 80px}
.hdr{text-align:center;margin-bottom:52px}
.hdr h1{font-size:clamp(36px,7vw,64px);font-weight:900;letter-spacing:-3px;line-height:1}
.hdr h1 span{color:var(--acc)}
.hdr p{margin-top:10px;font-size:10px;letter-spacing:5px;text-transform:uppercase;color:var(--dim)}
.card{width:100%;max-width:860px;background:var(--sur);border:1px solid var(--brd);border-radius:3px;padding:32px;margin-bottom:16px}
.ctitle{font-size:9px;letter-spacing:4px;text-transform:uppercase;color:var(--faint);margin-bottom:22px;padding-bottom:14px;border-bottom:1px solid var(--brd)}
.lbl{display:block;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
textarea,select{width:100%;background:var(--bg);border:1px solid var(--brd2);border-radius:2px;color:var(--txt);font-family:var(--mono);font-size:13px;padding:12px;transition:border-color .2s;outline:none;-webkit-appearance:none;appearance:none}
textarea:focus,select:focus{border-color:var(--acc)}
textarea{resize:vertical}
.fg{margin-bottom:18px}
.fg:last-child{margin-bottom:0}
.row{display:flex;gap:14px;flex-wrap:wrap}
.col{flex:1;min-width:140px}
.dz{border:1px dashed var(--brd2);border-radius:2px;padding:32px 20px;text-align:center;cursor:pointer;transition:all .2s;background:var(--bg);user-select:none}
.dz:hover,.dz.over{border-color:var(--acc);background:var(--glow)}
.dz .ico{font-size:28px;color:var(--faint);margin-bottom:8px}
.dz .mn{font-size:13px;color:var(--dim)}
.dz .hn{font-size:10px;color:var(--faint);margin-top:5px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:16px}
.pi{position:relative;aspect-ratio:1;border:1px solid var(--brd);border-radius:2px;overflow:hidden}
.pi img{width:100%;height:100%;object-fit:cover;display:block}
.prm{position:absolute;top:4px;right:4px;width:20px;height:20px;background:var(--acc);border:none;border-radius:50%;color:#fff;font-size:13px;line-height:20px;text-align:center;cursor:pointer;padding:0}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:20px}
.sbtn{background:var(--bg);border:1px solid var(--brd2);border-radius:2px;color:var(--dim);font-family:var(--mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:10px 8px;cursor:pointer;transition:all .15s;text-align:center}
.sbtn:hover{border-color:var(--acc);color:var(--txt)}
.sbtn.on{border-color:var(--acc);background:var(--glow);color:var(--acc)}
.gbtn{background:var(--acc);color:#fff;border:none;padding:14px 40px;font-family:var(--mono);font-size:11px;letter-spacing:4px;text-transform:uppercase;font-weight:700;cursor:pointer;border-radius:2px;transition:all .2s}
.gbtn:hover:not(:disabled){opacity:.85;transform:translateY(-1px)}
.gbtn:disabled{background:#222;color:#444;cursor:not-allowed;transform:none}
.stat{display:flex;align-items:center;gap:10px;font-size:10px;color:var(--faint);letter-spacing:2px;margin-top:16px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--acc);animation:pulse 1.4s ease-in-out infinite}
.err{background:#1a0808;border:1px solid #4a1515;border-radius:2px;padding:14px;font-size:12px;color:#ff6b6b;margin-top:16px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.rc{background:var(--sur);border:1px solid var(--brd);border-radius:3px;overflow:hidden;animation:slidein .35s ease}
.rrefs{padding:8px 14px;border-top:1px solid var(--brd);display:flex;gap:6px;align-items:center}
.rrefs img{width:26px;height:26px;object-fit:cover;border-radius:2px;opacity:.65}
.rrefs span{font-size:9px;color:var(--faint);letter-spacing:2px}
.rbody{padding:14px;border-top:1px solid var(--brd)}
.rdesc{font-size:12px;color:var(--txt);line-height:1.6;margin-bottom:6px}
.rtech{font-size:10px;color:var(--faint);margin-bottom:12px;line-height:1.5}
.rftr{display:flex;justify-content:space-between;align-items:center}
.rtime{font-size:9px;color:var(--faint);letter-spacing:1px}
.dlbtn{background:transparent;border:1px solid var(--brd2);color:var(--dim);font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;padding:6px 12px;cursor:pointer;border-radius:2px;transition:all .15s}
.dlbtn:hover{border-color:var(--dim);color:var(--txt)}
.bdg{background:#1a1a1a;border:1px solid var(--brd2);border-radius:2px;padding:2px 8px;font-size:9px;color:var(--faint);letter-spacing:1px;margin-left:10px}
.spn{display:inline-block;width:11px;height:11px;border:2px solid #444;border-top-color:#fff;border-radius:50%;animation:spin .75s linear infinite;vertical-align:middle;margin-right:8px}
.cfg-note{font-size:11px;color:#ff9944;background:#1a1200;border:1px solid #3a2800;border-radius:2px;padding:12px 14px;margin-bottom:16px;line-height:1.6}
.cfg-note a{color:#ffaa55;text-decoration:underline}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slidein{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
#fi{display:none}
</style>
</head>
<body>

<div class="hdr">
  <h1>IMG<span>::</span>GEN</h1>
  <p>AI Image Generation Studio</p>
</div>

<!-- PROMPT -->
<div class="card">
  <div class="ctitle">01 &mdash; Describe your vision</div>
  <div class="fg">
    <label class="lbl">Prompt</label>
    <textarea id="prompt" rows="4" placeholder="A lone figure at the edge of a glass city floating above storm clouds, golden hour light bleeding through the mist..."></textarea>
  </div>
  <div class="fg">
    <label class="lbl">Negative prompt <span style="color:#2a2a2a;font-size:9px">optional</span></label>
    <textarea id="neg" rows="2" placeholder="blur, watermark, low quality, text..."></textarea>
  </div>
</div>

<!-- UPLOAD -->
<div class="card">
  <div class="ctitle">02 &mdash; Reference images <span style="color:#2a2a2a;font-size:9px">optional</span></div>
  <div class="dz" id="dz">
    <div class="ico">&#8853;</div>
    <div class="mn">Drop images here or click to browse</div>
    <div class="hn">PNG &nbsp;·&nbsp; JPG &nbsp;·&nbsp; WEBP &nbsp;·&nbsp; multiple files</div>
  </div>
  <input type="file" id="fi" accept="image/*" multiple/>
  <div class="pgrid" id="pg"></div>
</div>

<!-- STYLE -->
<div class="card">
  <div class="ctitle">03 &mdash; Style &amp; settings</div>
  <label class="lbl" style="margin-bottom:12px">Visual style</label>
  <div class="sgrid" id="sg">
    <button class="sbtn on" data-s="cinematic">Cinematic</button>
    <button class="sbtn" data-s="neon">Neon Noir</button>
    <button class="sbtn" data-s="painterly">Painterly</button>
    <button class="sbtn" data-s="minimal">Minimal</button>
    <button class="sbtn" data-s="surreal">Surreal</button>
    <button class="sbtn" data-s="raw">Raw / Gritty</button>
  </div>
  <div class="row">
    <div class="col"><label class="lbl">Quality</label>
      <select id="qual"><option value="standard">Standard</option><option value="hd">HD</option></select>
    </div>
    <div class="col"><label class="lbl">Aspect ratio</label>
      <select id="sz"><option value="1024x1024">Square 1:1</option><option value="1792x1024">Landscape 16:9</option><option value="1024x1792">Portrait 9:16</option></select>
    </div>
  </div>
</div>

<!-- GENERATE -->
<div class="card">
  <div class="ctitle">04 &mdash; Generate</div>
  <button class="gbtn" id="gbtn" disabled>Generate Image</button>
  <div class="stat" id="stat" style="display:none"><span class="dot"></span><span>Optimizing prompt with Claude AI&hellip;</span></div>
  <div class="err" id="err" style="display:none"></div>
</div>

<!-- RESULTS -->
<div class="card" id="rcard" style="display:none">
  <div class="ctitle">Results <span class="bdg" id="rcount">0</span></div>
  <div class="rgrid" id="rg"></div>
</div>

<script>
var files = [], selectedStyle = 'cinematic', resultCount = 0;

var promptEl  = document.getElementById('prompt');
var negEl     = document.getElementById('neg');
var dz        = document.getElementById('dz');
var fi        = document.getElementById('fi');
var pg        = document.getElementById('pg');
var sg        = document.getElementById('sg');
var gbtn      = document.getElementById('gbtn');
var stat      = document.getElementById('stat');
var errEl     = document.getElementById('err');
var rcard     = document.getElementById('rcard');
var rg        = document.getElementById('rg');
var rcount    = document.getElementById('rcount');

function checkReady() {
  gbtn.disabled = !promptEl.value.trim();
}
promptEl.addEventListener('input', checkReady);

sg.addEventListener('click', function(e) {
  var b = e.target.closest('.sbtn');
  if (!b) return;
  document.querySelectorAll('.sbtn').forEach(function(x) { x.classList.remove('on'); });
  b.classList.add('on');
  selectedStyle = b.dataset.s;
});

dz.addEventListener('click', function() { fi.click(); });
dz.addEventListener('dragover', function(e) { e.preventDefault(); dz.classList.add('over'); });
dz.addEventListener('dragleave', function() { dz.classList.remove('over'); });
dz.addEventListener('drop', function(e) { e.preventDefault(); dz.classList.remove('over'); addFiles(e.dataTransfer.files); });
fi.addEventListener('change', function(e) { addFiles(e.target.files); fi.value = ''; });

function addFiles(list) {
  Array.from(list).filter(function(f) { return f.type.startsWith('image/'); }).forEach(function(f) {
    var r = new FileReader();
    r.onload = function(e) {
      files.push({ id: Date.now() + Math.random(), name: f.name, data: e.target.result, file: f });
      renderPreviews();
    };
    r.readAsDataURL(f);
  });
}

function renderPreviews() {
  pg.innerHTML = '';
  files.forEach(function(f) {
    var d = document.createElement('div');
    d.className = 'pi';
    d.innerHTML = '<img src="' + f.data + '" alt=""/><button class="prm" data-id="' + f.id + '">&times;</button>';
    pg.appendChild(d);
  });
  pg.querySelectorAll('.prm').forEach(function(b) {
    b.addEventListener('click', function(e) {
      e.stopPropagation();
      files = files.filter(function(f) { return f.id !== parseFloat(b.dataset.id); });
      renderPreviews();
    });
  });
}

var styleMap = {
  cinematic: 'cinematic, anamorphic lens flare, film grain, 35mm, dramatic contrast, volumetric lighting',
  neon:      'neon noir, cyberpunk city, rain-slicked streets, neon reflections, deep shadows, electric glow',
  painterly: 'oil painting, impasto technique, visible brushwork, rich texture, fine art, gallery quality',
  minimal:   'minimalist composition, soft diffused light, clean lines, editorial photography, muted palette',
  surreal:   'surrealism, dreamlike atmosphere, impossible physics, hyperrealistic detail, Dali-esque',
  raw:       'gritty realism, raw documentary style, harsh shadows, desaturated, street photography'
};

var palettes = {
  cinematic: { bg: '#0a0d14', a: '#c8a46e', b: '#4a6080', c: '#8a9fb8' },
  neon:      { bg: '#060810', a: '#ff2d7a', b: '#00e5ff', c: '#bf00ff' },
  painterly: { bg: '#1a1208', a: '#c87941', b: '#8b5e3c', c: '#e8c97a' },
  minimal:   { bg: '#f2f0ec', a: '#2a2826', b: '#888480', c: '#c8c4be' },
  surreal:   { bg: '#0e0818', a: '#e040fb', b: '#00bcd4', c: '#ff6090' },
  raw:       { bg: '#0c0c0c', a: '#d4cfc8', b: '#666260', c: '#9a9590' }
};

gbtn.addEventListener('click', generate);

async function generate() {
  var pval = promptEl.value.trim();
  var proxy = 'https://snowy-limit-c047.robert-d78.workers.dev';
  if (!pval) return;

  gbtn.disabled = true;
  gbtn.innerHTML = '<span class="spn"></span>Processing&hellip;';
  stat.style.display = 'flex';
  errEl.style.display = 'none';

  try {
    var content = [];
    files.forEach(function(f) {
      content.push({ type: 'image', source: { type: 'base64', media_type: f.file.type || 'image/jpeg', data: f.data.split(',')[1] } });
    });

    var txt = pval;
    if (negEl.value.trim()) txt += '\n\nAvoid: ' + negEl.value.trim();
    txt += '\n\nVisual style: ' + (styleMap[selectedStyle] || styleMap.cinematic);
    if (files.length > 0) txt = 'Use uploaded image(s) as visual reference. Prompt:\n\n' + txt;
    content.push({ type: 'text', text: txt });

    var SYS = 'You are an expert image generation prompt engineer. Respond ONLY with a JSON object, no markdown: {"imagePrompt":"<detailed prompt>","description":"<one sentence>","technicalDetails":"<lighting, composition, palette>"}';

    var res = await fetch(proxy, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: SYS,
        messages: [{ role: 'user', content: content }]
      })
    });

    var data = await res.json();
    if (data.error) throw new Error(data.error.message);

    var raw = ((data.content || []).find(function(b) { return b.type === 'text'; }) || {}).text || '';
    var parsed = { imagePrompt: pval, description: 'Generated image', technicalDetails: '' };
    try { parsed = JSON.parse(raw.replace(/```json|```/g, '').trim()); } catch(x) {}

    addResult(parsed);
  } catch(e) {
    errEl.textContent = 'Error: ' + (e.message || 'Generation failed. Check your proxy URL and API key.');
    errEl.style.display = 'block';
  } finally {
    gbtn.disabled = false;
    gbtn.innerHTML = 'Generate Image';
    stat.style.display = 'none';
    checkReady();
  }
}

function addResult(parsed) {
  resultCount++;
  var id = 'r' + Date.now();
  var pal = palettes[selectedStyle] || palettes.cinematic;
  var refs = files.map(function(f) { return f.data; });
  var time = new Date().toLocaleTimeString();
  var desc = parsed.description || 'Generated image';
  var tech = parsed.technicalDetails || '';

  var card = document.createElement('div');
  card.className = 'rc';
  card.id = 'card-' + id;

  var cv = document.createElement('canvas');
  cv.width = 680; cv.height = 382;
  cv.style.width = '100%'; cv.style.display = 'block';
  card.appendChild(cv);
  drawCanvas(cv, pal, desc, selectedStyle);

  if (refs.length > 0) {
    var rd = document.createElement('div');
    rd.className = 'rrefs';
    refs.forEach(function(src) {
      var img = document.createElement('img'); img.src = src; rd.appendChild(img);
    });
    var sp = document.createElement('span'); sp.textContent = 'REFS'; rd.appendChild(sp);
    card.appendChild(rd);
  }

  var body = document.createElement('div');
  body.className = 'rbody';
  body.innerHTML = '<div class="rdesc">' + desc + '</div>' +
    (tech ? '<div class="rtech">' + tech + '</div>' : '') +
    '<div class="rftr"><button class="dlbtn" onclick="dl(\'' + id + '\')">&#8595; Save PNG</button><span class="rtime">' + time + '</span></div>';
  card.appendChild(body);

  rg.insertBefore(card, rg.firstChild);
  rcard.style.display = 'block';
  rcount.textContent = resultCount;
}

function drawCanvas(cv, pal, desc, sty) {
  var ctx = cv.getContext('2d');
  var W = cv.width, H = cv.height;
  ctx.fillStyle = pal.bg; ctx.fillRect(0, 0, W, H);
  var g1 = ctx.createRadialGradient(W/2, H*0.45, 0, W/2, H*0.45, W*0.55);
  g1.addColorStop(0, ha(pal.a, 0.2)); g1.addColorStop(0.5, ha(pal.b, 0.09)); g1.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g1; ctx.fillRect(0, 0, W, H);
  var g2 = ctx.createRadialGradient(W*0.2, H*0.75, 0, W*0.2, H*0.75, W*0.38);
  g2.addColorStop(0, ha(pal.c, 0.13)); g2.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = ha(pal.a, 0.06); ctx.lineWidth = 0.5;
  for (var x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (var y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  ctx.strokeStyle = ha(pal.a, 0.22); ctx.lineWidth = 0.75;
  ctx.beginPath(); ctx.moveTo(80, H*0.52); ctx.lineTo(W-80, H*0.52); ctx.stroke();
  [80, 46, 22].forEach(function(r, i) {
    ctx.beginPath(); ctx.arc(W/2, H*0.43, r, 0, Math.PI*2);
    ctx.strokeStyle = ha(pal.a, 0.2 + i*0.15); ctx.lineWidth = 1; ctx.stroke();
  });
  ctx.beginPath(); ctx.arc(W/2, H*0.43, 9, 0, Math.PI*2);
  ctx.fillStyle = ha(pal.a, 0.45); ctx.fill();
  ctx.strokeStyle = ha(pal.a, 0.18); ctx.lineWidth = 0.75;
  ctx.beginPath(); ctx.moveTo(W/2, H*0.43-75); ctx.lineTo(W/2, H*0.43+75); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W/2-75, H*0.43); ctx.lineTo(W/2+75, H*0.43); ctx.stroke();
  ctx.fillStyle = ha(pal.a, 0.5); ctx.font = '600 9px Courier New'; ctx.textAlign = 'center';
  ctx.fillText(sty.toUpperCase() + '  \u00b7  AI GENERATED', W/2, H*0.72);
  ctx.fillStyle = ha('#e8e4de', 0.82); ctx.font = '11px Courier New';
  var words = desc.split(' '), line = '', lines = [];
  words.forEach(function(w) {
    var t = line + w + ' ';
    if (ctx.measureText(t).width > W-120 && line) { lines.push(line.trim()); line = w + ' '; } else line = t;
  });
  if (line) lines.push(line.trim());
  lines.slice(0, 2).forEach(function(l, i) { ctx.fillText(l, W/2, H*0.81 + i*18); });
  [[20,20,1,1],[W-20,20,-1,1],[W-20,H-20,-1,-1],[20,H-20,1,-1]].forEach(function(p) {
    ctx.strokeStyle = ha(pal.a, 0.28); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(p[0]+p[2]*14,p[1]); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(p[0],p[1]+p[3]*14); ctx.stroke();
  });
  ctx.strokeStyle = ha(pal.a, 0.14); ctx.lineWidth = 1; ctx.strokeRect(1,1,W-2,H-2);
}

function ha(hex, alpha) {
  hex = hex.replace('#','');
  if (hex.length === 3) hex = hex.split('').map(function(c){return c+c;}).join('');
  var r = parseInt(hex.slice(0,2),16), g = parseInt(hex.slice(2,4),16), b = parseInt(hex.slice(4,6),16);
  return 'rgba('+r+','+g+','+b+','+alpha+')';
}

function dl(id) {
  var card = document.getElementById('card-' + id);
  if (!card) return;
  var cv = card.querySelector('canvas');
  if (!cv) return;
  var a = document.createElement('a');
  a.href = cv.toDataURL('image/png');
  a.download = 'imggen-' + id + '.png';
  a.click();
}
</script>
</body>
</html>
